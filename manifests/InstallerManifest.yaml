AddonId: 66e9f2d7-67bb-43ef-b62a-b8e60734fcec
Packages:
  - Version: 0.6.55
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-08-05
    PackageUrl: https://github.com/Nikilua/GameSaveCenter/releases/download/v0.6.55/GameSaveCenter-0.6.55.pext
    Changelog:
      - 0.6.55：总览“需关注”指标改为可点击圆角操作卡，直接定位维护中心的具体原因。
      - 0.6.54：Worker 启动日志写入期望程序集版本，便于确认 Playnite 是否仍复用了旧 Worker。
      - 0.6.53：任务、概览和维护表格使用可读的主题状态胶囊和诊断等级文本。
      - 0.6.52：修改器列表使用可读的自动启动状态，避免直接显示 True/False。
      - 0.6.51：存档历史使用可读状态胶囊；Worker 启动日志写入程序集版本，便于排查 Playnite 仍加载旧包的问题。
      - 0.6.50：统一需关注阈值并补齐概览运行/关注指标；共享页面滚动资源增加拉伸与底部安全留白。
      - 0.6.49：增加 Worker 版本握手，拒绝复用旧版健康 Worker；针对 900+ 游戏库避免旧版全量 Ludusavi 启动逻辑残留。
      - 0.6.48：修复共享 DataGridRow 的标准选择性滚动结构，并防止 Playnite 导入/关闭阶段的瞬时空快照让 900+ 游戏目录降级为可终止 Worker 的小库路径。
      - 0.6.47：超大游戏库中不因短暂 Ping 超时杀掉仍在工作的 Worker，避免重启/管道超时循环；保留大库缓存优先和 UI 回调异常隔离。
      - 0.6.45：增加 Dispatcher 与动画异常隔离，避免共享 Freezable、窗口卸载或主题切换将 Playnite 扩展宿主打崩。
      - 0.6.41：禁用的上下文操作保留在布局中并降低透明度，不再因状态变化隐藏按钮或造成表格/卡片跳动；新增共享样式门禁。
      - 900+ 游戏库在未打开 GameSaveCenter 前不再自动提交整库匹配；打开面板后才释放同步闸门，持久化缓存仍可立即使用。
      - 可独立关闭 Steam、Xbox Game Bar、Windows 截图、游戏相邻目录和自定义媒体来源扫描。
      - 每个游戏可独立关闭自动备份与自动媒体归档；自定义来源支持暂停和移除，不会删除已归档媒体。
      - 事件断线、Worker 重启或事件积压时自动回退到 SQLite 快照与有界长轮询。
      - 修复超大游戏库、任务和日志列表中滚动滑块缩成尖点的问题。
      - 修复后台任务刷新跨线程访问 WPF 控件导致的 Playnite 崩溃。
      - View 属性变更先切回 Dispatcher，再读取任何 WPF 状态。
      - 自动刷新与初始化同步均改用可观察的 Task 流程。
      - 0.6.40：低高度下保留设置说明、保存提示与存档安全提示；安全兜底界面改用系统主题资源；继续保持页面级滚动、圆角控件、虚拟化和动态主题契约。
      - 0.6.39：统一 Settings 与侧栏的页面级滚动资源；低高度下保留页面摘要而由外层滚动承载溢出；提高表格有限视口，普通窗口一次可见更多行；保持所有主题、圆角控件、虚拟化和动态资源契约。
      - 0.6.38：大型库同步只持久化变化的游戏描述；描述输入变化会清理过期匹配并可靠重试；Worker 冷启动使用真实 30 秒墙钟截止，Dashboard 首次缓存读取采用 5 秒快速超时，任务事件连接延迟并安全取消，降低 900+ 游戏 Playnite 卡顿和崩溃风险。
      - 900+ 游戏库同步先持久化并立即可用，大批量 Ludusavi 匹配改为后台分批处理；大型库启动先让 Playnite 空闲 25 秒再开始匹配，Worker 忙碌时 Playnite 通知轮询指数退避。
      - Dashboard 和 Settings 构造异常时返回隔离诊断视图，避免单次 XAML 资源回归让 Playnite 弹出扩展崩溃窗口。
      - 修复 Worker 忙碌时健康探测超时就被误杀的问题；现有进程会先获得 45 秒恢复窗口。
      - Dashboard 首次打开不再进入完整命令的 Worker 等待边界，先显示持久化缓存，Worker 就绪后后台刷新。
      - Dashboard 外壳统一向存档、修改器和维护工作区转发响应式尺寸；设备状态页新增页面级滚动与有限 DataGrid 视口，矮窗口仍可访问多行和下方决策操作。
      - 900+ 游戏库后台匹配改为优先已安装/近期游玩游戏，并限制每轮最多 64 个 Ludusavi 匹配；未安装条目延后到游戏安装、启动或后续同步，避免首次打开后的长时间进程风暴。
      - Worker 使用当前用户级单实例互斥，重复启动只退出重复进程；同路径 Worker 健康恢复窗口延长到 45 秒，避免大型 SQLite/进程扫描期间被误杀并反复重启。
      - 页面级 ScrollViewer 统一为单一纵向滚动通道，表格保留双轴内部滚动和虚拟化，降低窄窗口裁切与长路径不可见问题。
      - 六个工作区统一增加页面级纵向滚动；共享 DataGrid/ListBox 视口提升为 320–560 DIP，保留虚拟化并避免表格只显示一两行。
      - 云端备份复制失败后会持久化并按退避计划自动重试，成功后自动清理队列。
      - 全局数值输入改为完整编辑后提交，修复游戏策略分钟输入无法可靠输入多位数的问题。
